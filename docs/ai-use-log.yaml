# E resolves merge conflicts; entries are authored by the PR author, not fabricated.
# The AI-use-log blocking gate (§6.6) diffs this file against code/prompt changes.
# This file defines the format and real entries backfilled from git history and
# OpenCode session records, plus one entry per gated PR going forward.

# Format (one entry per PR that touches code or prompts):
#   id               <student id>-<student name>-ai-use-01   (per-member sequence)
#   pr_id            PR number, or "pre-pr" / "N/A" for pre-PR work
#   date             YYYY-MM-DD
#   task             short description of what the entry covers
#   agent            coding-agent name used
#   model            model / tier used by the agent
#   prompt_version   versioned runtime prompt id (e.g. prompt_v1.0), or "N/A"
#   human_reviewed   true | false      (a human reviewed the agent output)
#   changes_accepted true | false      (the human accepted the changes as-is)
#   notes            free text (caveats, deviations, follow-ups)

