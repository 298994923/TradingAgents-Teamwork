# Team member E (linan, student 60252993)
# --- Functional requirements -------------------------------------------------

- id: REQ-E-01
  owner: E
  type: functional
  statement: >-
    Record each run as a JSON manifest containing version, config, prompt hashes,
    evidence snapshot, usage, duration, failure and stop reason. Identical inputs must
    produce identical bytes, secrets must be excluded, and existing files must not be
    overwritten.
  priority: Must
  source: Team split 8.2; teacher D4/D8; docs/contracts/run-event.md
  tradeoff: >-
    Fields owned by other members are stored without validation until their contracts
    are final.
  fit_criterion:
    metric: run_manifest_required_fields
    operator: ge
    threshold: 0
    verification:
    - src/tradingagents/run_recorder.py
    - test/offline/test_run_recorder.py
    - docs/contracts/run-event.md

- id: REQ-E-02
  owner: E
  type: functional
  statement: >-
    Open one usage window per application-level model call and settle it once, keeping
    unknown values as null instead of zero. Late callbacks must not change a frozen
    settlement, and concurrent windows must stay isolated.
  priority: Must
  source: docs/contracts/execution-budget.md; docs/plans/E/REQ-LINAN-USAGE.yaml; team split 8.2
  tradeoff: >-
    Incomplete usage is never refunded to the budget, which is conservative but prevents
    an unaffordable call from looking free.
  fit_criterion:
    metric: settlements_per_admitted_call
    operator: eq
    threshold: 0
    verification:
    - src/cli/stats_handler.py
    - test/offline/test_usage_window.py
    - test/offline/test_stats_calls.py

- id: REQ-E-03
  owner: E
  type: functional
  statement: >-
    Compare runs only when ticker, date, asset type, model, provider, language, prompt
    hashes and evidence mode all match. Refuse incomparable runs and keep missing
    numbers as null.
  priority: Must
  source: Team split 8.3; teacher D4; docs/evaluation/protocol.md
  tradeoff: >-
    Refusing a comparison is better than presenting a misleading table.
  fit_criterion:
    metric: guard_keys_checked_before_comparison
    operator: eq
    threshold: 0
    verification:
    - scripts/compare_runs.py
    - test/offline/test_compare_runs.py
    - docs/evaluation/protocol.md

- id: REQ-E-04
  owner: E
  type: functional
  statement: >-
    Compare multiple architecture variants with identical inputs and report measured
    calls, token usage, duration and outcome. Report only measured numbers and do not
    infer quality scores.
  priority: Must
  source: >-
    Team split 8.3; teacher D4; docs/evaluation/protocol.md;
    docs/evaluation/results/compare_run.md
  tradeoff: >-
    The report location is chosen by the author and is not fixed by this requirement.
  fit_criterion:
    metric: variant_comparisons_completed
    operator: ge
    threshold: 0
    verification:
    - scripts/compare_runs.py
    - docs/evaluation/protocol.md
    - docs/evaluation/results/compare_run.md
    - docs/evaluation/results/manifests/

- id: REQ-E-05
  owner: E
  type: functional
  statement: >-
    Hide trader and portfolio-manager proposals in reports when the deterministic guard
    returns BLOCK or REVIEW. Apply the same masking to Markdown and HTML, and leave PASS
