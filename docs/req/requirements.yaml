- id: GOV-001
  owner: E
  type: governance
  statement: The CI pipeline blocks a pull request that changes src/, prompts/, scripts/, or .github/ without
    adding an AI-use log entry with a unique id and human_reviewed true.
  priority: Must
  source: CS5351 project sheet, D7 §6.6 (AI-use log gate)
  tradeoff: Requires an extra log entry per code PR; accepted to keep an auditable AI-use record.
  fit_criterion:
    metric: ai-use-log gate exit code
    operator: eq
    threshold: 0
    verification:
    - scripts/check_ai_use_log.py
    - test/offline/test_ci_gates.py
- id: REQ-C-01
  owner: C
  type: functional
  statement: Protect final-review budget before optional follow-ups. In the independent policy fixture with 3
    versus 2 allowance units, reserve 2 before routing and invoke final review once in both cases; invoke the
    1-unit follow-up only with 3 units. Separately, the whole-graph 2-unit scenario terminates after the Research
    Manager requests review and makes zero Portfolio Manager calls.
  priority: Must
  source: docs/req/sources/c-registration-2026-11-23.md#req-c-01
  tradeoff: Independent policy and whole-graph assertions have different scopes; do not impose the fixture final-review
    call count on the whole graph.
  fit_criterion:
    metric: final_review_reservation_or_invocation_assertion_violations
    operator: eq
    threshold: 0
    verification:
    - test/offline/test_execution_policy.py::test_same_input_scales_with_budget
    - pending-whole-graph-test:C-P01-2-unit-review-stop
- id: REQ-C-02
  owner: C
  type: functional
  statement: Refuse unaffordable calls and emit no actionable recommendation when required review cannot run.
    With 2 units protected, invoke zero follow-ups and expose a denial reason. With 1 unit available for a 2-unit
    review, invoke zero final reviews and expose an insufficient-budget reason.
  priority: Must
  source: docs/req/sources/c-registration-2026-11-23.md#req-c-02
  tradeoff: D confirms non-executable, zero further model/PM calls and preservation of a more severe prior verdict,
    otherwise REVIEW; graph enforcement remains pending.
  fit_criterion:
    metric: unaffordable_call_or_actionable_output_or_denial_signal_violations
    operator: eq
    threshold: 0
    verification:
    - test/offline/test_execution_policy.py::test_denied_call_preserves_reservation_and_is_not_invoked
    - test/offline/test_execution_policy.py::test_t_p1_failed_reservation_locks_the_terminal_state
    - pending-whole-graph-test:C-P02-public-outcome
