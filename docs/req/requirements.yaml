# --- Governance requirements: CI gates, one entry each -----------------------

- id: GOV-E-01
  owner: E
  type: governance
  statement: >-
    Freeze the upstream code and Python environment, then migrate to the src/ layout in
    a separate PR. Installation, the CLI entry point and the original tests must still
    work after the migration.
  priority: Must
  source: Team split 8.1 and 3; teacher D8; docs/evaluation/baseline.md
  tradeoff: >-
    Freezing before changing is slower but gives every later comparison one fixed
    starting point.
  fit_criterion:
    metric: baseline_tests_passed
    operator: ge
    threshold: 0
    verification:
    - docs/evaluation/baseline.md
    - docs/evaluation/env.txt
    - git show b5d2f67

- id: GOV-E-02
  owner: E
  type: governance
  statement: >-
    Gate 1 checks only src/ code files. A changed source file needs an approved test
    record with the file, an approver and a date before the PR merges.
  priority: Must
  source: Teacher D7 section 6.1; docs/plans/E-ci-gates.md; scripts/check_test_approval.py
  tradeoff: >-
