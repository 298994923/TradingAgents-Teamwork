    operator: eq
    threshold: 0
    verification:
    - scripts/check_test_approval.py
    - docs/approvals.yaml
    - test/offline/test_ci_gates.py

- id: GOV-E-03
  owner: E
  type: governance
  statement: >-
    Gate 2 runs ruff, bytecode compilation and a dependency check on every commit. A
    pull request with an undeclared import is blocked.
  priority: Must
  source: Teacher D7 section 6.2; scripts/check_dependencies.py; .github/workflows/ci.yml
