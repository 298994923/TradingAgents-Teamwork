- id: REQ-C-01
  owner: C
  type: functional
  statement: Protect final-review budget before optional follow-ups. In the independent policy fixture with 3
    versus 2 allowance units, reserve 2 before routing and invoke final review once in both cases; invoke the
    1-unit follow-up only with 3 units. Separately, the whole-graph 2-unit scenario terminates after the Research
    Manager requests review and makes zero Portfolio Manager calls.
  priority: Must
  source: docs/req/sources/c-registration-2026-11-23.md#req-c-01
  tradeoff: Independent policy and whole-graph assertions have different scopes; do not impose the fixture final-review
    call count on the whole graph.
  fit_criterion:
    metric: final_review_reservation_or_invocation_assertion_violations
    operator: eq
    threshold: 0
    verification:
    - test/offline/test_execution_policy.py::test_same_input_scales_with_budget
    - pending-whole-graph-test:C-P01-2-unit-review-stop
