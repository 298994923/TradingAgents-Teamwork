name: CI

# CS5351 D7 blocking gates — status (last updated 2026-11-22)
#   Gate 1  Test approval ......... PARTIAL — test-approval job; checks src/ coverage only
#   Gate 2  Static analysis ....... DONE — lint job (ruff + compileall + dependency check)
#   Gate 3  Schema ................ PARTIAL — registry is a seed; A owns requirements.yaml
#   Gate 4  Semantic evaluation ... PARTIAL (advisory) — semantic-eval job (GOV-002)
#   Gate 5  Regression ............ DONE — tests job (runs tests/ and test/offline)
#   Gate 6  AI-use log ............ DONE — ai-use-log job (3 checks)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Gate 5 (Regression) — run tests/ and test/offline; pass when green.
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests test/offline

  # Gate 2 (Static analysis) — ruff, bytecode compile, and dependency check.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check src tests test scripts
      - run: python -m compileall -q src scripts
      - run: python scripts/check_dependencies.py

  # Gate 4 (Semantic evaluation) — PARTIAL, advisory only. GOV-002: keyword-proxy
  # scoring of the rendered bull/bear/research_manager prompts, plus a real-model
  # LLM-as-judge case (skipped when no API key). 
  semantic-eval:
    name: semantic-eval
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Score prompts (advisory)
        run: |
          set -o pipefail
          { echo "## Semantic eval (GOV-002, advisory)"; \
            python -m pytest -q test/offline/test_semantic_eval.py; } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # Gate 3 (Schema) — the requirements registry validates against its JSON schema.
  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python scripts/check_req_schema.py

  # Gate 1 (Test approval) — PARTIAL: gated src/ changes must be covered by an
  # approval record (src, approver, date) in docs/approvals.yaml.
  test-approval:
    name: test-approval
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python scripts/check_test_approval.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # Gate 6 (AI-use log) — PR changing src/, scripts/ or test/ must add a
  # new log entry with a unique id and human_reviewed: true.
  ai-use-log:
    name: ai-use-log
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python scripts/check_ai_use_log.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
